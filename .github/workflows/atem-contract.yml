name: ATEM published API contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-library-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.9'
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install test and pinned ATEM dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-atem.txt
      - name: Verify exact published package and run loopback-only contracts
        run: |
          python -c "import PyATEMMax; from importlib.metadata import version; assert version('PyATEMMax') == '1.0b9'"
          python -m pytest tests/test_atem_real_library_contract.py -v
