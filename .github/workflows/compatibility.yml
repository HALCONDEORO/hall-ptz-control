name: Python Compatibility

# Focused contracts only, not another full Qt suite or an OS/hardware claim.
on:
  pull_request:
    paths:
      - 'runtime/installer/**'
      - 'install_khptz_rpi.sh'
      - 'ptz/visca/**'
      - 'tests/test_visca_pure.py'
      - 'tests/test_installer_python_identity.py'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies (not appliance dependencies)
        run: python -m pip install 'pytest>=7,<9' PyYAML
      - name: Run protocol and installer interpreter contracts
        run: python -m pytest tests/test_visca_pure.py tests/test_installer_python_identity.py
